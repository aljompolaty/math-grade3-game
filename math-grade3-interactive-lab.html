<title>مختبر الرياضيات التفاعلي – الصف الثالث المتوسط (منهج بخت الرضا ٢٠٢٤م)</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf7ec;
  --card: #ffffff;
  --ink: #162438;
  --mut: #52637a;
  --acc: #e59b12;
  --acc2: #0066b3;
  --teal: #0f7b6c;
  --pink: #c81e56;
  --green: #1e8e3e;
  --ok: #1b8f4c;
  --bad: #cf3535;
  --line: #dfd5b8;
  --concept-bg: #e8f4fa;
  --concept-border: #2b7de9;
  --theorem-bg: #fffdf7;
  --theorem-border: #d9383a;
  --ribbon: #c5d92d;
  --ribbon-dark: #a6b91e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] {
  --bg: #0d1826;
  --card: #152338;
  --ink: #f3efe4;
  --mut: #9cb0c9;
  --acc: #ffc23d;
  --acc2: #54b2ff;
  --teal: #4fd1b8;
  --pink: #ff699b;
  --green: #4cd97b;
  --line: #283c5c;
  --concept-bg: #162c46;
  --concept-border: #4a9eff;
  --theorem-bg: #241d29;
  --theorem-border: #ff6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cairo', Tahoma, Arial, sans-serif;
  line-height: 1.75;
  min-height: 100vh;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
}
.wrap { max-width: 980px; margin: auto; padding: 14px 16px 40px; }

/* الشريط العلوي */
.top {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 10px 14px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,.05);
}
.hud-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill {
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 99px;
  padding: 3px 12px;
  font-weight: 800;
  font-size: .92rem;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
button, input, select { font-family: inherit; }
button { cursor: pointer; }
.btn {
  background: var(--acc);
  color: #162438;
  border: 0;
  border-radius: 12px;
  padding: 8px 18px;
  font-size: .98rem;
  font-weight: 800;
  box-shadow: 0 3px 0 rgba(0,0,0,.22);
  transition: transform .12s, box-shadow .12s, background .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.btn.alt {
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--line);
  box-shadow: 0 2px 0 rgba(0,0,0,.08);
}
.btn.teal { background: var(--teal); color: #fff; }
.btn.blue { background: var(--acc2); color: #fff; }
.btn.pink { background: var(--pink); color: #fff; }
.btn.sm { padding: 5px 11px; font-size: .86rem; border-radius: 10px; }

/* شريط البحث برقم الصفحة */
.page-jump-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  background: var(--card);
  border: 2px solid var(--acc2);
  border-radius: 16px;
  padding: 8px 14px;
  margin-bottom: 14px;
}
.page-jump-bar input {
  width: 110px;
  padding: 5px 10px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  font-weight: 800;
  font-size: .95rem;
  text-align: center;
}

/* ترويسة الكتاب الرسمية */
.book-banner {
  background: linear-gradient(135deg, var(--card) 0%, var(--concept-bg) 100%);
  border: 2px solid var(--acc2);
  border-radius: 22px;
  padding: 18px 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.book-banner::before {
  content: "";
  position: absolute;
  left: -30px;
  bottom: -30px;
  width: 140px;
  height: 140px;
  background: var(--ribbon);
  opacity: .25;
  transform: rotate(35deg);
}
.ministry-tag {
  font-size: .84rem;
  font-weight: 700;
  color: var(--acc2);
  margin-bottom: 4px;
}
h1 { font-size: 1.75rem; font-weight: 900; margin: 0 0 6px; line-height: 1.3; }
h1 span { color: var(--teal); }

/* بطاقات الوحدات */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
  gap: 12px;
}
.les {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  text-align: right;
  color: var(--ink);
  transition: transform .15s, border-color .15s, box-shadow .15s;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.les:hover {
  transform: translateY(-3px);
  border-color: var(--acc2);
  box-shadow: 0 8px 18px rgba(0,102,179,.12);
}
.les-ribbon {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 42px;
  height: 10px;
  background: var(--ribbon);
  border-top-right-radius: 8px;
}
.num {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--acc2);
  color: #fff;
  font-weight: 900;
  margin-left: 8px;
  font-size: .95rem;
}
.les b { font-size: 1.08rem; }
.les small { color: var(--mut); display: block; margin-top: 4px; line-height: 1.45; }

/* ورقة الكتاب المدرسي */
.book-sheet {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 22px;
  padding: 20px 20px 58px;
  margin: 12px 0;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
}
.book-header-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding-bottom: 10px;
  margin-bottom: 14px;
  border-bottom: 2px solid var(--line);
}
.lesson-title-pink {
  color: var(--pink);
  font-size: 1.38rem;
  font-weight: 900;
  margin: 4px 0 10px;
}
.sec-tag {
  display: inline-block;
  font-weight: 900;
  font-size: 1.05rem;
  margin: 8px 0 4px;
}
.sec-tag.blue { color: var(--acc2); }
.sec-tag.green { color: var(--green); }
.sec-tag.pink { color: var(--pink); }

/* صندوق مفهوم أساسي الرسمي */
.concept-box {
  background: var(--concept-bg);
  border: 2.5px solid var(--concept-border);
  border-radius: 18px;
  padding: 18px 18px 14px;
  margin: 18px 0 14px;
  position: relative;
}
.concept-badge {
  position: absolute;
  top: -14px;
  left: 18px;
  background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
  color: #162438;
  font-weight: 900;
  font-size: .88rem;
  padding: 2px 14px;
  border-radius: 6px;
  border: 1.5px solid #94a3b8;
  transform: rotate(-7deg);
  box-shadow: 0 3px 6px rgba(0,0,0,.12);
}

/* صندوق النظرية والنتيجة (وحدة الدائرة) */
.theorem-box {
  background: var(--theorem-bg);
  border: 2.5px dashed var(--theorem-border);
  border-radius: 18px;
  padding: 16px 18px;
  margin: 16px 0;
}
.theorem-title {
  color: var(--acc2);
  font-weight: 900;
  font-size: 1.15rem;
  margin-bottom: 6px;
}
.corollary-box {
  background: rgba(15,123,108,.09);
  border: 2px solid var(--teal);
  border-radius: 16px;
  padding: 12px 16px;
  margin: 12px 0;
}
.proof-box {
  background: var(--bg);
  border-right: 4px solid var(--acc2);
  border-radius: 10px;
  padding: 10px 14px;

    const s = a.currentTime + t + at;
    g.gain.setValueAtTime(v, s);
    g.gain.exponentialRampToValueAtTime(.001, s + d);
    o.start(s); o.stop(s + d);
  } catch (e) {}
}

const elAudioCache = new Map();

function openAudioDB() {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open('mg_yousef_voice_db_v3', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('clips')) db.createObjectStore('clips');
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

async function getCachedClip(textKey) {
  if (B64_YOUSEF[textKey]) return B64_YOUSEF[textKey];
  if (elAudioCache.has(textKey)) return elAudioCache.get(textKey);
  const db = await openAudioDB();
  if (!db) return null;
  return new Promise(resolve => {
    try {
      const tx = db.transaction('clips', 'readonly');
      const req = tx.objectStore('clips').get(textKey);
      req.onsuccess = () => {
        if (req.result) {
          if (typeof req.result === 'string' && req.result.startsWith('data:')) {
            B64_YOUSEF[textKey] = req.result;
            syncEmbeddedDataScriptTag();
            elAudioCache.set(textKey, req.result);
            resolve(req.result);
          } else if (req.result instanceof Blob) {
            blobToDataURL(req.result).then(dUrl => {
              if (dUrl) {
                B64_YOUSEF[textKey] = dUrl;
                syncEmbeddedDataScriptTag();
                elAudioCache.set(textKey, dUrl);
              }
              resolve(dUrl);
            });
          } else resolve(null);
        } else resolve(null);
      };
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

function blobToDataURL(blob) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

async function setCachedClip(textKey, blob) {
  const dataUrl = await blobToDataURL(blob);
  if (dataUrl) {
    B64_YOUSEF[textKey] = dataUrl;
    elAudioCache.set(textKey, dataUrl);
    syncEmbeddedDataScriptTag();
  }
  const db = await openAudioDB();
  if (!db) return;
  try {
    const tx = db.transaction('clips', 'readwrite');
    tx.objectStore('clips').put(dataUrl || blob, textKey);
  } catch (e) {}
}

function stopAllSpeech() {

  }

}

function dataUrlToArrayBuffer(dataUrl) {
  const base64 = dataUrl.split(',')[1] || '';
  const bin = atob(base64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function playDataUrlViaWebAudio(dataUrl, onEndCallback) {
  try {
    const ctx = ac();
    if (ctx.state === 'suspended') await ctx.resume();
    const arrBuf = dataUrlToArrayBuffer(dataUrl);
    const audioBuffer = await ctx.decodeAudioData(arrBuf.slice(0));
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(ctx.destination);
    currentBufferSource = source;
    source.onended = () => {
      if (currentBufferSource === source) currentBufferSource = null;
      if (onEndCallback) onEndCallback();
    };
    source.start(0);
    return true;
  } catch (webaudioErr) {
    // Fallback to HTMLAudioElement if WebAudio decode fails
    return new Promise((resolve, reject) => {
      try {
        currentElAudio = new Audio(dataUrl);
        currentElAudio.onended = () => {
          if (onEndCallback) onEndCallback();
          resolve(true);
        };
        currentElAudio.onerror = e => reject(e);
        currentElAudio.play().then(() => resolve(true)).catch(reject);
      } catch (e) { reject(e); }
    });
  }
}

function fallbackBrowserSay(t) {
  if (!voice || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    const voices = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
    const pref = voices.find(v => /SD|sudan|yousef|youssef|maged|tarik|naayf|hamdan/i.test(v.name + ' ' + v.lang)) || voices[0];

  } catch (e) {}
}

async function synthesizeYousefClip(cleanText, signal) {
  let apiKey = (elConfig.apiKey || DEFAULT_EL_KEY).trim();
  if (!apiKey || apiKey.startsWith(OLD_EXHAUSTED_KEY_PREFIX)) {
    apiKey = DEFAULT_EL_KEY;
    elConfig.apiKey = DEFAULT_EL_KEY;
  }
  const voiceId = (elConfig.voiceId || YOUSEF_VOICE_ID).trim();
  const primaryModel = (elConfig.modelId || 'eleven_flash_v2_5').trim();
  const modelsToTry = primaryModel === 'eleven_flash_v2_5'
    ? ['eleven_flash_v2_5', 'eleven_multilingual_v2']
    : [primaryModel, 'eleven_flash_v2_5'];

  let lastErr = null;
  for (let mIdx = 0; mIdx < modelsToTry.length; mIdx++) {
    const modelId = modelsToTry[mIdx];
    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}?output_format=mp3_44100_128`, {
      method: 'POST',
      headers: {
        'Accept': 'audio/mpeg',
        'Content-Type': 'application/json',
        'xi-api-key': apiKey
      },
      body: JSON.stringify({
        text: cleanText,
        model_id: modelId,
        voice_settings: {
          stability: 0.65,
          similarity_boost: 0.82,
          style: 0.15,
          use_speaker_boost: true
        }
      }),
      signal
    });

    if (resp.ok) {
      return await resp.blob();
    }

    let errMsg = `HTTP ${resp.status}`;
    try {
      const errJson = await resp.json();
      const detail = errJson.detail;
      if (detail) {
        errMsg = typeof detail === 'string' ? detail : ((detail.status ? detail.status + ': ' : '') + (detail.message || JSON.stringify(detail)));
      }
    } catch (e) {}
    lastErr = new Error(errMsg);
  }
  throw lastErr;
}

    if (spBtn) {
      spBtn.innerHTML = '🔊 إعادة سماع الشرح';

    fallbackBrowserSay(cleanText);
  }
}

function mountInteractiveLab(mode, container) {

  /* ----- مختبرات الوحدة الأولى: التطبيق ----- */
  if (mode.startsWith('u1_')) {
    let preset = mode === 'u1_def' ? 'not_func' : mode === 'u1_range' ? 'linear' : mode === 'u1_types' ? 'surj_not_inj' : 'bijective';
    let reversed = false;

    const presets = {
      not_func: {
        title: 'مثال (٢) ص ١١–١٢: علاقة ليست تطبيقاً (العنصر جـ خرج منه سهمان)',
        dom: ['أ','ب','جـ','د'],
        cod: ['٢','٤','٦','٨','١٠'],
        pairs: [[0,1],[1,0],[2,3],[2,4],[3,2]],
        rule: 'ع = { (أ،٤) ، (ب،٢) ، (جـ،٨) ، (جـ،١٠) ، (د،٦) }'
      },
      linear: {
        title: 'ملخص ص ٣٥: التطبيق ت(س) = ٢س من س={١، ٢، ٣} إلى ص={٢، ٤، ٦}',
        dom: ['١','٢','٣'],
        cod: ['٢','٤','٦'],
        pairs: [[0,0],[1,1],[2,2]],
        rule: 'ت(س) = ٢س   (المخطط السهمي + الجدول + التمثيل الشبكي)'
      },
      surj_not_inj: {
        title: 'شكل (جـ) ص ٢٠: تطبيق شامل وغير متباين (المدى = ص، والعنصر ٤ وصله سهمان)',
        dom: ['٠','١','٢','٣'],
        cod: ['٤','٥'],
        pairs: [[0,0],[1,0],[2,1],[3,1]],
        rule: 'المدى = {٤، ٥} = المجال المقابل (شامل)، لكن ت(٠)=ت(١)=٤ (غير متباين)'
      },
      inj_not_surj: {
        title: 'نشاط ص ٢٤: تطبيق متباين (واحد لواحد ١-١) وغير شامل',
        dom: ['أ','ب','جـ','د'],
        cod: ['١','٢','٣','٤','٥'],
        pairs: [[0,1],[1,0],[2,3],[3,4]],
        rule: 'المدى = {١، ٢، ٤، ٥} ≠ المجال المقابل (العنصر ٣ لم يصله سهم)'
      },
      bijective: {
        title: 'مثال (١) ص ٣٨: تطبيق تقابل ر : س ← ص ومعكوسه ر⁻¹ : ص ← س',
        dom: ['١','٢','٣','٤'],
        cod: ['أ','ب','جـ','د'],
        pairs: [[0,0],[1,3],[2,2],[3,1]],
        rule: 'تطبيق شامل ومتباين (تقابل) ⟹ التطبيق العكسي ر⁻¹ موجود'
      }
    };

    function renderU1() {
      const p = presets[preset];
      const leftSet = reversed ? p.dom : p.cod;
      const rightSet = reversed ? p.cod : p.dom;
      const leftLabel = reversed ? 'س (المجال المقابل لـ ر⁻¹)' : 'ص (المجال المقابل)';
      const rightLabel = reversed ? 'ص (مجال ر⁻¹)' : 'س (المجال)';
      const activePairs = reversed ? p.pairs.map(([u,v]) => [v,u]) : p.pairs;

      // فحص شروط التطبيق
      const outCounts = rightSet.map((_, idx) => activePairs.filter(pr => pr[0] === idx).length);
      const inCounts = leftSet.map((_, idx) => activePairs.filter(pr => pr[1] === idx).length);
      const isFunc = outCounts.every(c => c === 1);
      const isSurj = isFunc && inCounts.every(c => c >= 1);
      const isInj = isFunc && inCounts.every(c => c <= 1);
      const isBij = isFunc && isSurj && isInj;
      const rangeElems = leftSet.filter((_, idx) => inCounts[idx] > 0);

      // بناء المخطط السهمي والتمثيل الشبكي جنباً إلى جنب
      const svgH = 215;
      const rY = idx => 45 + idx * (135 / Math.max(1, rightSet.length - 1));
      const lY = idx => 45 + idx * (135 / Math.max(1, leftSet.length - 1));

      container.innerHTML = `
        <div style="font-weight:800;color:var(--pink);text-align:center;margin-bottom:6px">${p.title}</div>
        <svg viewBox="0 0 720 ${svgH}">
          <!-- المخطط السهمي (يمين الشكل) -->
          <text x="545" y="20" font-size="13" font-weight="bold" fill="var(--acc2)" text-anchor="middle">١) المخطط السهمي</text>
          <rect x="605" y="28" width="66" height="162" rx="28" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
          <rect x="425" y="28" width="66" height="162" rx="28" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
          <text x="638" y="206" font-size="12" font-weight="bold" fill="var(--teal)" text-anchor="middle">${rightLabel}</text>
          <text x="458" y="206" font-size="12" font-weight="bold" fill="var(--teal)" text-anchor="middle">${leftLabel}</text>

          ${rightSet.map((el, idx) => `
            <circle cx="638" cy="${rY(idx)}" r="13" fill="${outCounts[idx]===1?'rgba(15,123,108,.15)':'rgba(214,69,69,.22)'}"/>
            <text x="638" y="${rY(idx)+5}" font-size="14" font-weight="bold" fill="var(--ink)" text-anchor="middle">${el}</text>
          `).join('')}

          ${leftSet.map((el, idx) => `
            <circle cx="458" cy="${lY(idx)}" r="13" fill="${inCounts[idx]>0?'rgba(0,102,179,.15)':'transparent'}"/>
            <text x="458" y="${lY(idx)+5}" font-size="14" font-weight="bold" fill="var(--ink)" text-anchor="middle">${el}</text>
          `).join('')}

          ${activePairs.map(([u, v]) => {
            const x1 = 605, y1 = rY(u), x2 = 493, y2 = lY(v);
            const ang = Math.atan2(y2 - y1, x2 - x1);
            const hx1 = x2 - 9 * Math.cos(ang - 0.35), hy1 = y2 - 9 * Math.sin(ang - 0.35);
            const hx2 = x2 - 9 * Math.cos(ang + 0.35), hy2 = y2 - 9 * Math.sin(ang + 0.35);
            return `
              <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--pink)" stroke-width="2.2"/>
              <polygon points="${x2},${y2} ${hx1},${hy1} ${hx2},${hy2}" fill="var(--pink)"/>
            `;
          }).join('')}

          <!-- التمثيل الشبكي (يسار الشكل كما في ص ٣٣ و٣٥) -->
          <text x="190" y="20" font-size="13" font-weight="bold" fill="var(--acc2)" text-anchor="middle">٢) التمثيل الشبكي (ص ٣٣–٣٥)</text>
          <rect x="65" y="32" width="240" height="145" fill="var(--card)" stroke="var(--ink)" stroke-width="1.8"/>
          ${rightSet.map((el, idx) => {
            const gx = 95 + idx * (180 / Math.max(1, rightSet.length - 1));
            return `
              <line x1="${gx}" y1="32" x2="${gx}" y2="177" stroke="var(--line)" stroke-width="1.2"/>
              <text x="${gx}" y="196" font-size="12" font-weight="bold" fill="var(--ink)" text-anchor="middle">${el}</text>
            `;
          }).join('')}
          ${leftSet.map((el, idx) => {
            const gy = 160 - idx * (112 / Math.max(1, leftSet.length - 1));
            return `
              <line x1="65" y1="${gy}" x2="305" y2="${gy}" stroke="var(--line)" stroke-width="1.2"/>
              <text x="48" y="${gy+4}" font-size="12" font-weight="bold" fill="var(--ink)" text-anchor="middle">${el}</text>
            `;
          }).join('')}
          ${activePairs.map(([u, v]) => {
            const gx = 95 + u * (180 / Math.max(1, rightSet.length - 1));
            const gy = 160 - v * (112 / Math.max(1, leftSet.length - 1));
            return `<text x="${gx}" y="${gy+6}" font-size="18" font-weight="900" fill="var(--pink)" text-anchor="middle">×</text>`;
          }).join('')}
        </svg>

        <!-- التمثيل الجدولي والأزواج المرتبة -->
        <table class="book-table">
          <tr>
            <th>س</th>
            ${rightSet.map(el => `<td>${el}</td>`).join('')}
          </tr>
          <tr>
            <th>ص = ت(س)</th>
            ${rightSet.map((_, idx) => {
              const found = activePairs.filter(pr => pr[0] === idx).map(pr => leftSet[pr[1]]);
              return `<td>${found.length ? found.join(' ، ') : '—'}</td>`;
            }).join('')}
          </tr>
        </table>

        <div class="lab-status">
          ${isFunc
            ? `✅ <b>يمثل تطبيقاً</b> | المدى = { ${rangeElems.join(' ، ')} } | ${isSurj ? 'شامل ✔' : 'غير شامل ✖'} | ${isInj ? 'متباين (١-١) ✔' : 'غير متباين ✖'} | ${isBij ? '🌟 <b>تقابل (له تطبيق عكسي)</b>' : 'ليس تقابلاً'}`
            : `❌ <b>لا يمثل تطبيقاً</b> لأن هناك عنصراً في المجال لم يرتبط بعنصر واحد فقط.`}
        </div>

        <div class="lab-controls">
          <button class="btn alt sm" data-p="not_func">علاقة ليست تطبيقاً (ص ١٢)</button>
          <button class="btn alt sm" data-p="linear">ت(س) = ٢س (ص ٣٥)</button>
          <button class="btn alt sm" data-p="surj_not_inj">شامل وغير متباين (ص ٢٠)</button>
          <button class="btn alt sm" data-p="inj_not_surj">متباين وغير شامل (ص ٢٤)</button>
          <button class="btn alt sm" data-p="bijective">تقابل ومعكوسه (ص ٣٨)</button>
          <button class="btn pink sm" id="revArrowsBtn">🔄 اعكس اتجاه الأسهم (د⁻¹)</button>
        </div>
      `;

      container.querySelectorAll('[data-p]').forEach(b => {
        b.onclick = () => { sfx('click'); preset = b.dataset.p; reversed = false; renderU1(); };
      });
      $('revArrowsBtn').onclick = () => { sfx('click'); reversed = !reversed; renderU1(); };
    }
    renderU1();
    return;
  }

  /* ----- مختبرات الوحدة الثانية: الأسس واللوغريثمات ----- */
  if (mode.startsWith('u2_')) {
    let base = 2, expM = 3, expN = 2, logSampleIdx = 0;
    const logSamples = [
      { num: '٥٦٣٦', char: '٣', mant: '٧٥١', full: '٣,٧٥١', reason: 'العدد > ١، الجزء الصحيح (٥٦٣٦) مكون من ٤ أرقام ⟹ العدد البياني = ٤ − ١ = ٣' },
      { num: '٥٦,٣٦', char: '١', mant: '٧٥١', full: '١,٧٥١', reason: 'العدد > ١، الجزء الصحيح (٥٦) مكون من رقمين ⟹ العدد البياني = ٢ − ١ = ١' },
      { num: '٥,٦٣٦', char: 'صفر', mant: '٧٥١', full: '٠,٧٥١', reason: 'العدد > ١، الجزء الصحيح (٥) مكون من رقم واحد ⟹ العدد البياني = ١ − ١ = صفر' },
      { num: '٠,٥٦٣٦', char: '<span class="bar-num">١</span>', mant: '٧٥١', full: '<span class="bar-num">١</span>,٧٥١', reason: 'العدد < ١، لا يوجد أصفار يمين الفاصلة مباشرة ⟹ العدد البياني = −(٠ + ١) = ١̄' },
      { num: '٠,٠٥٦٣٦', char: '<span class="bar-num">٢</span>', mant: '٧٥١', full: '<span class="bar-num">٢</span>,٧٥١', reason: 'العدد < ١، يوجد صفر واحد يمين الفاصلة مباشرة ⟹ العدد البياني = −(١ + ١) = ٢̄' }
    ];

    function renderU2() {
      const mulRes = Math.pow(base, expM + expN);
      const powVal = Math.pow(base, expM);
      const mFactors = Array(Math.max(1, expM)).fill(toAr(base)).join(' × ');
      const nFactors = Array(Math.max(1, expN)).fill(toAr(base)).join(' × ');
      const ls = logSamples[logSampleIdx];

      container.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px">
          <div style="background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px">
            <div style="font-weight:800;color:var(--acc2);margin-bottom:6px">١) مفكك القوى ومحول اللوغريثم (ص ٤٩ و٦٥):</div>
            <div class="formula" style="font-size:1.1rem;margin:6px 0">
              ${toAr(base)}<sup>${toAr(expM)}</sup> × ${toAr(base)}<sup>${toAr(expN)}</sup> = (${mFactors}) × (${nFactors}) = ${toAr(base)}<sup>${toAr(expM + expN)}</sup> = ${toAr(mulRes)}
            </div>
            <div class="formula" style="font-size:1.1rem;margin:6px 0;color:var(--pink)">
              الصورة الأسية: ${toAr(base)}<sup>${toAr(expM)}</sup> = ${toAr(powVal)}   ⟺   اللوغريثمية: لو<sub>${toAr(base)}</sub> ${toAr(powVal)} = ${toAr(expM)}
            </div>
            <div class="lab-controls">
              <label>الأساس (أ): ${toAr(base)} <input type="range" id="u2Base" min="2" max="5" value="${base}"></label>
              <label>الأس (م): ${toAr(expM)} <input type="range" id="u2M" min="1" max="5" value="${expM}"></label>
              <label>الأس (ن): ${toAr(expN)} <input type="range" id="u2N" min="1" max="4" value="${expN}"></label>
            </div>
          </div>

          <div style="background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px">
            <div style="font-weight:800;color:var(--acc2);margin-bottom:6px">٢) مختبر اللوغريثم العشري والعدد البياني (مثال ٢ ص ٧٠):</div>
            <div style="font-size:.9rem;text-align:center">بما أن <b>لو ٥,٦٣٦ = ٠,٧٥١</b>، حرّك الفاصلة العشرية ولاحظ تغير العدد البياني:</div>
            <div class="formula" style="font-size:1.25rem;margin:8px 0">
              لو ${ls.num} = ${ls.full}
            </div>
            <div style="font-size:.88rem;color:var(--teal);font-weight:700;text-align:center">${ls.reason}</div>
            <div class="lab-controls">
              ${logSamples.map((item, idx) => `
                <button class="btn ${idx===logSampleIdx?'blue':'alt'} sm" data-ls="${idx}">${item.num}</button>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      $('u2Base').oninput = e => { base = +e.target.value; renderU2(); };
      $('u2M').oninput = e => { expM = +e.target.value; renderU2(); };
      $('u2N').oninput = e => { expN = +e.target.value; renderU2(); };
      container.querySelectorAll('[data-ls]').forEach(b => {
        b.onclick = () => { sfx('click'); logSampleIdx = +b.dataset.ls; renderU2(); };
      });
    }
    renderU2();
    return;
  }

  /* ----- مختبرات الوحدة الثالثة: المستوى الديكارتي والمعادلات الآنية ----- */
  if (mode.startsWith('u3_')) {
    let px = 2, py = 3, sysIdx = 0;
    const systems = [
      {
        title: 'مثال ص ٨٩–٩٠: (١) ص + س = ٥  ،  (٢) ٢ص − س = ١',
        eq1: x => 5 - x,
        eq2: x => (1 + x) / 2,
        solX: 3, solY: 2,
        elimStep: 'بجمع المعادلتين (١) و(٢) تُحذف س: ٣ص = ٦ ⟹ ص = ٢ ، وبالتعويض س = ٣',
        compStep: 'من (١): س = ٥ − ص ، ومن (٢): س = ٢ص − ١ ⟹ ٥ − ص = ٢ص − ١ ⟹ ٣ص = ٦ ⟹ ص = ٢',
        subStep: 'من (١): ص = ٥ − س ، نعوض في (٢): ٢(٥ − س) − س = ١ ⟹ ١٠ − ٣س = ١ ⟹ س = ٣'
      },
      {
        title: 'مثال (١) ص ٩١–٩٢: (١) ص − س = ٢  ،  (٢) ص + س = ٨',
        eq1: x => x + 2,
        eq2: x => 8 - x,
        solX: 3, solY: 5,
        elimStep: 'بالجمع المباشر تُحذف س: ٢ص = ١٠ ⟹ ص = ٥ ، وبالتعويض س = ٣',
        compStep: 'من (١): ص = ٢ + س ، ومن (٢): ص = ٨ − س ⟹ ٢ + س = ٨ − س ⟹ ٢س = ٦ ⟹ س = ٣',
        subStep: 'نعوض ص = ٢ + س في (٢): (٢ + س) + س = ٨ ⟹ ٢س = ٦ ⟹ س = ٣ و ص = ٥'
      },
      {
        title: 'مثال ص ١٠٢: (١) ٣س + ٤ص = ٥  ،  (٢) ٢س − ٣ص = ٩',
        eq1: x => (5 - 3 * x) / 4,
        eq2: x => (2 * x - 9) / 3,
        solX: 3, solY: -1,
        elimStep: 'نضرب (١)×٢ و(٢)×(−٣) ونجمع: ١٧ص = −١٧ ⟹ ص = −١ ، ومنها س = ٣',
        compStep: 'من (١): س = (٥−٤ص)÷٣ ، ومن (٢): س = (٩+٣ص)÷٢ ⟹ ١٠−٨ص = ٢٧+٩ص ⟹ ص = −١',
        subStep: 'نعوض س = (٩+٣ص)÷٢ في (١) فنجد ١٧ص = −١٧ ⟹ ص = −١ و س = ٣'
      }
    ];

    function renderU3() {
      const sys = systems[sysIdx];
      const cx = 160, cy = 115, scale = 16;
      const toSvgX = x => cx + x * scale;
      const toSvgY = y => cy - y * scale;

      const quad = px > 0 && py > 0 ? 'الربع الأول (+ ، +)'
        : px < 0 && py > 0 ? 'الربع الثاني (− ، +)'
        : px < 0 && py < 0 ? 'الربع الثالث (− ، −)'
        : px > 0 && py < 0 ? 'الربع الرابع (+ ، −)'
        : px === 0 && py === 0 ? 'نقطة الأصل و(٠ ، ٠)'
        : px === 0 ? 'تقع على المحور الصادي' : 'تقع على المحور السيني';

      container.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;align-items:center">
          <svg viewBox="0 0 320 230" style="background:var(--card);border:1.5px solid var(--line);border-radius:14px">
            <!-- شبكة التربيعات -->
            ${[-8,-6,-4,-2,0,2,4,6,8].map(v => `
              <line x1="${toSvgX(v)}" y1="15" x2="${toSvgX(v)}" y2="215" stroke="var(--line)" stroke-width="1"/>
              <line x1="20" y1="${toSvgY(v)}" x2="300" y2="${toSvgY(v)}" stroke="var(--line)" stroke-width="1"/>
            `).join('')}
            <!-- المحوران السيني والصادي -->
            <line x1="20" y1="${cy}" x2="300" y2="${cy}" stroke="var(--ink)" stroke-width="2"/>
            <line x1="${cx}" y1="15" x2="${cx}" y2="215" stroke="var(--ink)" stroke-width="2"/>
            <text x="292" y="${cy-6}" font-size="11" font-weight="bold" fill="var(--ink)">+س</text>
            <text x="${cx+14}" y="24" font-size="11" font-weight="bold" fill="var(--ink)">+ص</text>

            <!-- المستقيم الأول والمستقيم الثاني -->
            <line x1="${toSvgX(-6)}" y1="${toSvgY(sys.eq1(-6))}" x2="${toSvgX(7)}" y2="${toSvgY(sys.eq1(7))}" stroke="var(--acc2)" stroke-width="2.2"/>
            <line x1="${toSvgX(-6)}" y1="${toSvgY(sys.eq2(-6))}" x2="${toSvgX(7)}" y2="${toSvgY(sys.eq2(7))}" stroke="var(--teal)" stroke-width="2.2"/>

            <!-- نقطة تقاطع المستقيمين -->
            <circle cx="${toSvgX(sys.solX)}" cy="${toSvgY(sys.solY)}" r="5.5" fill="var(--ok)" stroke="#fff" stroke-width="1.5"/>
            <text x="${toSvgX(sys.solX)+8}" y="${toSvgY(sys.solY)-8}" font-size="11" font-weight="900" fill="var(--ok)">الحل (${toAr(sys.solX)}، ${toAr(sys.solY)})</text>

            <!-- النقطة الحرة التي يحركها الطالب -->
            <line x1="${toSvgX(px)}" y1="${cy}" x2="${toSvgX(px)}" y2="${toSvgY(py)}" stroke="var(--pink)" stroke-width="1.5" stroke-dasharray="3,3"/>
            <line x1="${cx}" y1="${toSvgY(py)}" x2="${toSvgX(px)}" y2="${toSvgY(py)}" stroke="var(--pink)" stroke-width="1.5" stroke-dasharray="3,3"/>
            <circle cx="${toSvgX(px)}" cy="${toSvgY(py)}" r="6" fill="var(--pink)"/>
            <text x="${toSvgX(px)}" y="${toSvgY(py)-10}" font-size="12" font-weight="900" fill="var(--pink)" text-anchor="middle">أ(${toAr(px)}، ${toAr(py)})</text>
          </svg>

          <div>
            <div style="background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px">
              <div style="font-weight:800;color:var(--pink)">📍 النقطة المختارة: أ(${toAr(px)} ، ${toAr(py)}) ⟵ ${quad}</div>
              <div class="lab-controls" style="justify-content:flex-start">
                <label>س: ${toAr(px)} <input type="range" id="u3X" min="-6" max="6" value="${px}"></label>
                <label>ص: ${toAr(py)} <input type="range" id="u3Y" min="-5" max="5" value="${py}"></label>
              </div>
            </div>

            <div style="background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px">
              <div style="font-weight:800;color:var(--acc2);margin-bottom:4px">📈 ${sys.title}</div>
              <div style="font-size:.86rem;margin-bottom:4px">• <b>بالجمع:</b> ${sys.elimStep}</div>
              <div style="font-size:.86rem;margin-bottom:4px">• <b>بالمقابلة:</b> ${sys.compStep}</div>
              <div style="font-size:.86rem;color:var(--teal);font-weight:700">• <b>مجموعة الحل المشترك:</b> { (${toAr(sys.solX)} ، ${toAr(sys.solY)}) }</div>
              <div class="lab-controls" style="margin-top:6px">
                ${systems.map((sItem, idx) => `
                  <button class="btn ${idx===sysIdx?'blue':'alt'} sm" data-sys="${idx}">نظام (${toAr(idx+1)})</button>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      $('u3X').oninput = e => { px = +e.target.value; renderU3(); };
      $('u3Y').oninput = e => { py = +e.target.value; renderU3(); };
      container.querySelectorAll('[data-sys]').forEach(b => {
        b.onclick = () => { sfx('click'); sysIdx = +b.dataset.sys; renderU3(); };
      });
    }
    renderU3();
    return;
  }

  /* ----- مختبرات الوحدة الرابعة: الدائرة والنظريات الـ ١٤ ----- */
  if (mode.startsWith('u4_')) {
    let tab = mode === 'u4_chords' ? 0 : mode === 'u4_angles' ? 1 : mode === 'u4_cyclic' ? 2 : 3;
    let centralDeg = 80, vertexPos = 90, cyclicA = 95, tangAngle = 50;

    function renderU4() {
      const cx = 175, cy = 110, r = 82;
      const ptOnCircle = deg => {
        const rad = (deg - 90) * Math.PI / 180;
        return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
      };

      let svgContent = '', desc = '', controls = '';

      if (tab === 0) {
        // نظريات ١ - ٤: العمود النازل من المركز على الوتر
        const [ax, ay] = ptOnCircle(140);
        const [bx, by] = ptOnCircle(220);
        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        svgContent = `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="var(--acc2)" stroke-width="2.5"/>
          <line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="var(--teal)" stroke-width="1.8" stroke-dasharray="4,3"/>
          <line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="var(--teal)" stroke-width="1.8" stroke-dasharray="4,3"/>
          <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="var(--pink)" stroke-width="3"/>
          <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="var(--acc2)" stroke-width="2.5"/>
          <rect x="${mx}" y="${my-10}" width="10" height="10" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
          <circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--ink)"/>
          <text x="${cx+12}" y="${cy-4}" font-size="13" font-weight="bold">م (نق=٥سم)</text>
          <text x="${ax+14}" y="${ay+6}" font-size="13" font-weight="bold">أ</text>
          <text x="${bx-14}" y="${by+6}" font-size="13" font-weight="bold">ب</text>
          <text x="${mx}" y="${my+18}" font-size="12" font-weight="bold" fill="var(--acc2)" text-anchor="middle">جـ (منتصف أ ب)</text>
          <text x="${(ax+mx)/2}" y="${ay-6}" font-size="11" font-weight="bold" fill="var(--pink)">٤ سم</text>
          <text x="${(bx+mx)/2}" y="${by-6}" font-size="11" font-weight="bold" fill="var(--pink)">٤ سم</text>
          <text x="${cx-22}" y="${(cy+my)/2}" font-size="11" font-weight="bold" fill="var(--acc2)">٣ سم</text>
        `;
        desc = '<b>نظريات (١–٤) ص ١٢٩–١٣٦:</b> العمود النازل من مركز الدائرة (م جـ) على الوتر (أ ب) ينصّفه، ويكوّن مثلثاً قائم الزاوية في جـ يحقق نظرية فيثاغورث: م أ² = م جـ² + أ جـ² (٥² = ٣² + ٤²).';
      } else if (tab === 1) {
        // نظريات ٥ - ٧: الزاوية المركزية والمحيطية
        const half = centralDeg / 2;
        const [ax, ay] = ptOnCircle(180 - half);
        const [bx, by] = ptOnCircle(180 + half);
        const [jx, jy] = ptOnCircle(vertexPos - 90);
        const insc = centralDeg / 2;
        svgContent = `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="var(--acc2)" stroke-width="2.5"/>
          <line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="var(--teal)" stroke-width="2.4"/>
          <line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="var(--teal)" stroke-width="2.4"/>
          <line x1="${jx}" y1="${jy}" x2="${ax}" y2="${ay}" stroke="var(--pink)" stroke-width="2"/>
          <line x1="${jx}" y1="${jy}" x2="${bx}" y2="${by}" stroke="var(--pink)" stroke-width="2"/>
          <circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--ink)"/>
          <circle cx="${jx}" cy="${jy}" r="5" fill="var(--pink)"/>
          <text x="${cx}" y="${cy-8}" font-size="12" font-weight="bold" text-anchor="middle">م</text>
          <text x="${cx}" y="${cy+22}" font-size="12" font-weight="900" fill="var(--teal)" text-anchor="middle">${toAr(centralDeg)}°</text>
          <text x="${jx}" y="${jy-10}" font-size="12" font-weight="900" fill="var(--pink)" text-anchor="middle">جـ (${toAr(insc)}°)</text>
          <text x="${ax+12}" y="${ay+10}" font-size="12" font-weight="bold">أ</text>
          <text x="${bx-12}" y="${by+10}" font-size="12" font-weight="bold">ب</text>
        `;
        desc = `<b>نظريات (٥–٧) ص ١٣٩–١٤٣:</b> الزاوية المركزية ⦠ أ م ب = <b>${toAr(centralDeg)}°</b> تساوي ضعف الزاوية المحيطية ⦠ أ جـ ب = <b>${toAr(insc)}°</b>.${centralDeg===180 ? ' 🌟 <b>(مرسومة على قطر الدائرة فتكون قائمة ٩٠° تماماً!)</b>' : ''}`;
        controls = `
          <label>الزاوية المركزية: ${toAr(centralDeg)}° <input type="range" id="u4Cent" min="40" max="180" step="10" value="${centralDeg}"></label>
          <label>موضع الرأس جـ على القوس: <input type="range" id="u4Vert" min="40" max="140" value="${vertexPos}"></label>
          <button class="btn teal sm" id="u4DiamBtn">اجعل أ ب قطراً (١٨٠°)</button>
        `;
      } else if (tab === 2) {
        // نظريتا ٩ و ١٠: الرباعي الدائري
        const [p1x, p1y] = ptOnCircle(55);
        const [p2x, p2y] = ptOnCircle(135);
        const [p3x, p3y] = ptOnCircle(235);
        const [p4x, p4y] = ptOnCircle(315);
        const oppC = 180 - cyclicA;
        svgContent = `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="var(--acc2)" stroke-width="2.5"/>
          <polygon points="${p1x},${p1y} ${p2x},${p2y} ${p3x},${p3y} ${p4x},${p4y}" fill="rgba(15,123,108,.08)" stroke="var(--pink)" stroke-width="2.2"/>
          <!-- امتداد الضلع للزاوية الخارجية -->
          <line x1="${p4x}" y1="${p4y}" x2="${p3x - 42}" y2="${p3y + 18}" stroke="var(--teal)" stroke-width="2.2"/>
          <text x="${p1x+8}" y="${p1y-4}" font-size="12" font-weight="900" fill="var(--pink)">أ (${toAr(cyclicA)}°)</text>
          <text x="${p2x+10}" y="${p2y+10}" font-size="12" font-weight="bold">ب</text>
          <text x="${p3x+6}" y="${p3y-8}" font-size="12" font-weight="900" fill="var(--acc2)">جـ (${toAr(oppC)}°)</text>
          <text x="${p4x-12}" y="${p4y-6}" font-size="12" font-weight="bold">د</text>
          <text x="${p3x-34}" y="${p3y+4}" font-size="11" font-weight="900" fill="var(--teal)">خارجية=${toAr(cyclicA)}°</text>
        `;
        desc = `<b>نظريتا (٩ و١٠) ص ١٥٠–١٥١:</b> في الرباعي الدائري كل زاويتين متقابلتين متكاملتان: ق(أ) + ق(جـ) = ${toAr(cyclicA)}° + ${toAr(oppC)}° = <b>١٨٠°</b>، والزاوية الخارجية عند جـ تساوي المقابلة للمجاورة لها = <b>${toAr(cyclicA)}°</b>.`;
        controls = `<label>قياس الزاوية أ: ${toAr(cyclicA)}° <input type="range" id="u4Cyc" min="60" max="130" value="${cyclicA}"></label>`;
      } else {
        // نظريات ١١ - ١٤: المماس والزاوية المماسية
        const [bx, by] = ptOnCircle(180); // نقطة التماس بالأسفل
        const [cx2, cy2] = ptOnCircle(70);
        const [dx, dy] = ptOnCircle(295);
        svgContent = `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="var(--acc2)" stroke-width="2.5"/>
          <!-- خط المماس بالأسفل -->
          <line x1="45" y1="${by}" x2="305" y2="${by}" stroke="var(--teal)" stroke-width="2.8"/>
          <!-- نصف القطر العمودي على المماس -->
          <line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="var(--acc2)" stroke-width="1.8" stroke-dasharray="4,3"/>
          <!-- الوتر ب جـ والزاوية المحيطية ب د جـ -->
          <polygon points="${bx},${by} ${cx2},${cy2} ${dx},${dy}" fill="rgba(200,30,86,.08)" stroke="var(--pink)" stroke-width="2.2"/>
          <circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--ink)"/>
          <text x="${cx-12}" y="${cy}" font-size="12" font-weight="bold">م</text>
          <text x="295" y="${by+16}" font-size="12" font-weight="bold" fill="var(--teal)">المماس أ</text>
          <text x="${bx}" y="${by+16}" font-size="12" font-weight="bold">ب (التماس)</text>
          <text x="${bx+42}" y="${by-6}" font-size="12" font-weight="900" fill="var(--teal)">مماسية=${toAr(tangAngle)}°</text>
          <text x="${dx-22}" y="${dy}" font-size="12" font-weight="900" fill="var(--pink)">د (${toAr(tangAngle)}°)</text>
          <text x="${cx2+10}" y="${cy2}" font-size="12" font-weight="bold">جـ</text>
        `;
        desc = `<b>نظريات (١٢–١٤) ص ١٥٥–١٦٤:</b> المماس عمودي على نصف القطر م ب (٩٠°)، والزاوية المماسية ⦠ أ ب جـ (<b>${toAr(tangAngle)}°</b>) تساوي الزاوية المحيطية ⦠ ب د جـ (<b>${toAr(tangAngle)}°</b>) المرسومة على نفس الوتر من الجهة الأخرى، والمركزية = <b>${toAr(tangAngle * 2)}°</b>.`;
        controls = `<label>الزاوية المماسية: ${toAr(tangAngle)}° <input type="range" id="u4Tang" min="30" max="75" value="${tangAngle}"></label>`;
      }

      container.innerHTML = `
        <div class="lab-controls" style="margin-bottom:8px">
          <button class="btn ${tab===0?'blue':'alt'} sm" data-u4="0">الأوتار والعمود النازل (١–٤)</button>
          <button class="btn ${tab===1?'blue':'alt'} sm" data-u4="1">المركزية والمحيطية (٥–٧)</button>
          <button class="btn ${tab===2?'blue':'alt'} sm" data-u4="2">الرباعي الدائري (٩–١٠)</button>
          <button class="btn ${tab===3?'blue':'alt'} sm" data-u4="3">المماس والمماسية (١١–١٤)</button>
        </div>
        <svg viewBox="0 0 350 220" style="max-width:440px">${svgContent}</svg>
        <div class="lab-status">${desc}</div>
        <div class="lab-controls">${controls}</div>
      `;

      container.querySelectorAll('[data-u4]').forEach(b => {
        b.onclick = () => { sfx('click'); tab = +b.dataset.u4; renderU4(); };
      });
      if ($('u4Cent')) $('u4Cent').oninput = e => { centralDeg = +e.target.value; renderU4(); };
      if ($('u4Vert')) $('u4Vert').oninput = e => { vertexPos = +e.target.value; renderU4(); };
      if ($('u4DiamBtn')) $('u4DiamBtn').onclick = () => { sfx('click'); centralDeg = 180; renderU4(); };
      if ($('u4Cyc')) $('u4Cyc').oninput = e => { cyclicA = +e.target.value; renderU4(); };
      if ($('u4Tang')) $('u4Tang').oninput = e => { tangAngle = +e.target.value; renderU4(); };
    }
    renderU4();
    return;
  }

  /* ----- مختبرات الوحدة الخامسة: ضرب وتحليل المقادير الجبرية ----- */
  if (mode.startsWith('u5_')) {
    let aVal = 2, bVal = 3, cutMode = (mode === 'u5_diff2');

    function renderU5() {
      if (!cutMode) {
        const sumAB = aVal + bVal, prodAB = aVal * bVal;
        container.innerHTML = `
          <div style="font-weight:800;color:var(--acc2);text-align:center;margin-bottom:6px">
            نموذج المساحات الهندسي لضرب المقادير وتحليل المقدار الثلاثي (نشاط ص ١٧٢–١٧٣ وص ١٩١)
          </div>
          <svg viewBox="0 0 540 190">
            <!-- المربع س² -->
            <rect x="310" y="25" width="95" height="90" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
            <text x="357" y="75" font-size="16" font-weight="900" fill="#1e40af" text-anchor="middle">س²</text>
            <text x="357" y="18" font-size="13" font-weight="bold" fill="var(--ink)" text-anchor="middle">س</text>
            <text x="420" y="75" font-size="13" font-weight="bold" fill="var(--ink)" text-anchor="middle">س</text>

            <!-- المستطيل أ س -->
            <rect x="195" y="25" width="115" height="90" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
            <text x="252" y="75" font-size="15" font-weight="900" fill="#15803d" text-anchor="middle">${toAr(aVal)}س</text>
            <text x="252" y="18" font-size="13" font-weight="bold" fill="var(--ink)" text-anchor="middle">+ ${toAr(aVal)}</text>

            <!-- المستطيل ب س -->
            <rect x="310" y="115" width="95" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
            <text x="357" y="150" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">${toAr(bVal)}س</text>
            <text x="420" y="150" font-size="13" font-weight="bold" fill="var(--ink)" text-anchor="middle">+ ${toAr(bVal)}</text>

            <!-- المستطيل أ × ب -->
            <rect x="195" y="115" width="115" height="60" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
            <text x="252" y="150" font-size="15" font-weight="900" fill="#be185d" text-anchor="middle">${toAr(prodAB)}</text>
          </svg>
          <div class="lab-status">
            (س + ${toAr(aVal)})(س + ${toAr(bVal)}) = س² + (${toAr(aVal)} + ${toAr(bVal)})س + (${toAr(aVal)} × ${toAr(bVal)}) = <b>س² + ${toAr(sumAB)}س + ${toAr(prodAB)}</b>
            ${aVal === bVal ? ' 🌟 <b>(مربع كامل لأن العاملين متساويان!)</b>' : ''}
          </div>
          <div class="lab-controls">
            <label>العدد الأول (م): ${toAr(aVal)} <input type="range" id="u5A" min="1" max="9" value="${aVal}"></label>
            <label>العدد الثاني (ن): ${toAr(bVal)} <input type="range" id="u5B" min="1" max="9" value="${bVal}"></label>
            <button class="btn teal sm" id="u5SwitchBtn">✂️ نشاط قص الكرتون للفرق بين مربعين (ص ٢٠٧)</button>
          </div>
        `;
        $('u5A').oninput = e => { aVal = +e.target.value; renderU5(); };
        $('u5B').oninput = e => { bVal = +e.target.value; renderU5(); };
      } else {
        container.innerHTML = `
          <div style="font-weight:800;color:var(--pink);text-align:center;margin-bottom:6px">
            نشاط قص الكرتون المربع (٨سم × ٨سم) لاستنتاج الفرق بين مربعين (ص ٢٠٧–٢٠٨)
          </div>
          <svg viewBox="0 0 620 185">
            <!-- قبل القص: المربع الكبير ٨×٨ ناقص الركن ٢×٢ -->
            <text x="480" y="20" font-size="13" font-weight="bold" fill="var(--acc2)" text-anchor="middle">١) قُصّ مربع (٢×٢) من المربع (٨×٨)</text>
            <rect x="415" y="32" width="130" height="130" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
            <rect x="415" y="122" width="40" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
            <text x="435" y="146" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">٢×٢</text>
            <text x="480" y="90" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">٨² − ٢²</text>
            <text x="562" y="98" font-size="12" font-weight="bold">٨ سم</text>

            <text x="330" y="100" font-size="22" font-weight="900" fill="var(--teal)" text-anchor="middle">⟵</text>

            <!-- بعد إعادة التركيب: مستطيل طوله (٨+٢)=١٠ وعرضه (٨-٢)=٦ -->
            <text x="155" y="20" font-size="13" font-weight="bold" fill="var(--teal)" text-anchor="middle">٢) إعادة تركيب الباقي كمستطيل (٨+٢)×(٨−٢)</text>
            <rect x="45" y="52" width="160" height="90" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
            <rect x="205" y="52" width="48" height="90" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
            <text x="125" y="44" font-size="12" font-weight="bold" text-anchor="middle">٨ سم</text>
            <text x="229" y="44" font-size="12" font-weight="bold" text-anchor="middle">٢ سم</text>
            <text x="26" y="102" font-size="12" font-weight="bold" text-anchor="middle">٦ سم</text>
            <text x="148" y="102" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">المساحة = ١٠ × ٦ = ٦٠ سم²</text>
          </svg>
          <div class="lab-status">
            ٨² − ٢² = ٦٤ − ٤ = <b>٦٠ سم²</b>   ⟺   (٨ + ٢)(٨ − ٢) = ١٠ × ٦ = <b>٦٠ سم²</b>   ⟹   <b>س² − ص² = (س + ص)(س − ص)</b>
          </div>
          <div class="lab-controls">
            <button class="btn blue sm" id="u5SwitchBtn">🔙 العودة لمختبر بلاطات الجبر والمقدار الثلاثي</button>
          </div>
        `;
      }
      $('u5SwitchBtn').onclick = () => { sfx('click'); cutMode = !cutMode; renderU5(); };
    }
    renderU5();
    return;
  }

  /* ----- مختبرات الوحدة السادسة: معادلات الدرجة الثانية وتكوينها من جذريها ----- */
  if (mode.startsWith('u6_')) {
    let r1 = -2, r2 = 1;
    function renderU6() {
      const sumR = r1 + r2;
      const prodR = r1 * r2;
      const bCoeff = -sumR;
      const cCoeff = prodR;

      const bTerm = bCoeff === 0 ? '' : bCoeff > 0 ? ` + ${bCoeff===1?'':toAr(bCoeff)}س` : ` − ${Math.abs(bCoeff)===1?'':toAr(Math.abs(bCoeff))}س`;
      const cTerm = cCoeff === 0 ? '' : cCoeff > 0 ? ` + ${toAr(cCoeff)}` : ` − ${toAr(Math.abs(cCoeff))}`;
      const eqStr = `س²${bTerm}${cTerm} = ٠`;

      const f1 = r1 === 0 ? 'س' : r1 > 0 ? `(س − ${toAr(r1)})` : `(س + ${toAr(Math.abs(r1))})`;
      const f2 = r2 === 0 ? 'س' : r2 > 0 ? `(س − ${toAr(r2)})` : `(س + ${toAr(Math.abs(r2))})`;

      container.innerHTML = `
        <div style="font-weight:800;color:var(--acc2);text-align:center;margin-bottom:6px">
          مصنع تكوين وحل معادلة الدرجة الثانية إذا عُلم جذراها (م ، ن) – كتاب بخت الرضا (ص ٢٢٨–٢٣٣)
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">
          <div style="background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center">
            <div style="font-weight:800;color:var(--pink)">الطريقة الأولى (المجموع وحاصل الضرب):</div>
            <div>مجموع الجذرين (م + ن) = (${toAr(r1)}) + (${toAr(r2)}) = <b>${toAr(sumR)}</b></div>
            <div>حاصل ضرب الجذرين (م × ن) = (${toAr(r1)}) × (${toAr(r2)}) = <b>${toAr(prodR)}</b></div>
            <div style="font-size:.88rem;color:var(--mut);margin-top:4px">س² − (مجموع الجذرين)س + (حاصل ضربهما) = ٠</div>
          </div>
          <div style="background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center">
            <div style="font-weight:800;color:var(--teal)">الطريقة الثانية (خاصية الضرب الصفري):</div>
            <div>العاملان هما: <b>${f1} ${f2} = ٠</b></div>
            <div class="formula" style="font-size:1.3rem;margin:6px 0">${eqStr}</div>
          </div>
        </div>
        <div class="lab-status">
          مجموعة الحل = { ${toAr(r1)} ، ${toAr(r2)} }
          ${cCoeff === 0 ? ' | 🌟 <b>حالة خاصة أولى (جـ = ٠): أحد الجذرين يساوي صفراً!</b>' : ''}
          ${bCoeff === 0 && cCoeff < 0 ? ' | 🌟 <b>حالة خاصة ثانية (ب = ٠): فرق بين مربعين (جذران متعاكسان)!</b>' : ''}
        </div>
        <div class="lab-controls">
          <label>الجذر الأول (م): ${toAr(r1)} <input type="range" id="u6R1" min="-7" max="7" value="${r1}"></label>
          <label>الجذر الثاني (ن): ${toAr(r2)} <input type="range" id="u6R2" min="-7" max="7" value="${r2}"></label>

      $('u6R2').oninput = e => { r2 = +e.target.value; renderU6(); };

      $('u6Spec1').onclick = () => { sfx('click'); r1 = 0; r2 = 5; renderU6(); };
      $('u6Spec2').onclick = () => { sfx('click'); r1 = -4; r2 = 4; renderU6(); };

  /* ----- مختبرات الوحدة السابعة: الإحصاء (المدرج والمضلع وتوازن الصناديق) ----- */

                  <text x="${bx+22}" y="172" font-size="10" font-weight="bold" fill="var(--ink)" text-anchor="middle">${classes[idx]}</text>
                  <text x="${bx+22}" y="${by-5}" font-size="11" font-weight="900" fill="var(--ink)" text-anchor="middle">${toAr(f)}</text>
                `;
              }).join('')}
              ${showPoly ? `
                <polyline points="${freqs.map((f, idx) => `${92 + idx * 44},${155 - f * 11}`).join(' ')}" fill="none" stroke="var(--pink)" stroke-width="2.5"/>
                ${freqs.map((f, idx) => `<circle cx="${92 + idx * 44}" cy="${155 - f * 11}" r="4" fill="var(--pink)"/>`).join('')}
              ` : ''}
            </svg>
            <div style="font-size:.83rem;text-align:center;font-weight:700">الفئة المنوالية هي <b>(٢٠ - ٢٥)</b> لأنها تقابل أكبر تكرار (١١)، والمنوال = مركزها = <b>٢٢,٥</b></div>
            <div class="lab-controls">
              <button class="btn ${showHist?'teal':'alt'} sm" id="u7HistBtn">📊 إظهار/إخفاء المدرج</button>
              <button class="btn ${showPoly?'pink':'alt'} sm" id="u7PolyBtn">📈 إظهار/إخفاء المضلع</button>
            </div>
          </div>

          <!-- نشاط توزيع الصناديق للوسط الحسابي ص ٢٥٧ -->
          <div style="background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px">
            <div style="font-weight:800;color:var(--acc2);text-align:center;margin-bottom:4px">
              ٢) نشاط توزيع الصناديق للوسط الحسابي (صفحة ٢٥٧)
            </div>
            <svg viewBox="0 0 300 165">
              <line x1="20" y1="140" x2="280" y2="140" stroke="var(--acc2)" stroke-width="2"/>
              ${boxData.map((cnt, col) => {
                const x = 45 + col * 60;
                let boxes = '';
                for (let b = 0; b < cnt; b++) {
                  boxes += `<rect x="${x}" y="${122 - b * 15}" width="40" height="13" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>`;
                }
                return `
                  ${boxes}
                  <text x="${x+20}" y="156" font-size="13" font-weight="900" fill="var(--pink)" text-anchor="middle">(${toAr(cnt)})</text>
                `;
              }).join('')}
            </svg>
            <div style="font-size:.86rem;text-align:center;font-weight:700">
              المجموع = ٣ + ٥ + ٨ + ٤ = ٢٠ صندوقاً | الوسط الحسابي = ٢٠ ÷ ٤ = <b>٥ صناديق لكل عامل</b>
            </div>
            <div class="lab-controls">
              <button class="btn blue sm" id="u7BalBtn">${balanced ? '↩️ أعد الصناديق قبل التوزيع (٣، ٥، ٨، ٤)' : '⚖️ وزّع الصناديق بالتساوي (٥ لكل عامل)'}</button>

        </div>

      $('u7PolyBtn').onclick = () => { sfx('click'); showPoly = !showPoly; renderU7(); };

  if (mode.startsWith('u8_')) {
    let pours = 0, rVal = 3, hVal = 6;
    function renderU8() {
      const cylVol = (3.14 * rVal * rVal * hVal).toFixed(1);
      const coneVol = (3.14 * rVal * rVal * hVal / 3).toFixed(1);
      const sphVol = (4 / 3 * 3.14 * Math.pow(rVal, 3)).toFixed(1);

              <!-- الرمل المفرغ داخل الأسطوانة -->
              ${pours > 0 ? `<rect x="52" y="${131 - fillH}" width="76" height="${fillH}" fill="#facc15"/>` : ''}

              <line x1="50" y1="99" x2="130" y2="99" stroke="var(--acc2)" stroke-width="1" stroke-dasharray="3,3"/>
              <ellipse cx="90" cy="35" rx="40" ry="10" fill="#e2e8f0" stroke="var(--acc2)" stroke-width="2"/>
              <ellipse cx="90" cy="131" rx="40" ry="10" fill="${pours>0?'#eab308':'#cbd5e1'}" stroke="var(--acc2)" stroke-width="2"/>
              <text x="90" y="158" font-size="12" font-weight="bold" text-anchor="middle">أسطوانة / مكعب (${toAr(pours)}/٣ ممتلئ)</text>
            </svg>
            <div class="lab-controls">
              <button class="btn teal sm" id="u8PourBtn">⏳ املأ المخروط بالرمل وفرّغه (${toAr(pours)}/٣)</button>
              <button class="btn alt sm" id="u8ResetBtn">🔄 تصفير الإناء</button>
            </div>
          </div>

          <div style="background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px">
            <div style="font-weight:800;color:var(--acc2);margin-bottom:6px">حاسبة الحجوم المقارنة (بنفس نق = ${toAr(rVal)} سم ، ع = ${toAr(hVal)} سم):</div>

            <div style="font-size:.92rem;margin-bottom:5px;color:var(--teal)">• <b>حجم المخروط</b> = ١/٣ π نق² ع = <b>${toAr(coneVol)} سم³</b> (ثلث الأسطوانة)</div>
            <div style="font-size:.92rem;margin-bottom:5px;color:var(--pink)">• <b>حجم الكرة (نصف قطرها ${toAr(rVal)} سم)</b> = ٤/٣ π نق³ = <b>${toAr(sphVol)} سم³</b></div>
            <div class="lab-controls" style="margin-top:8px">

            </div>
          </div>
        </div>
      `;

      $('u8PourBtn').onclick = () => {
        pours = pours < 3 ? pours + 1 : 1;
        sfx(pours === 3 ? 'win' : 'ok');

      $('u8ResetBtn').onclick = () => { sfx('click'); pours = 0; renderU8(); };
      $('u8R').oninput = e => { rVal = +e.target.value; renderU8(); };
      $('u8H').oninput = e => { hVal = +e.target.value; renderU8(); };
    }
    renderU8();
    return;
  }
}

    `;

/* ===== إدارة دفتر أخطائي الذكي (Smart Mistake Notebook) ===== */
let mistakes = {};
try {
  mistakes = JSON.parse(localStorage.getItem('mg_mistakes') || '{}');
} catch (e) {}

function saveMistakes() {
  try { localStorage.setItem('mg_mistakes', JSON.stringify(mistakes)); } catch (e) {}
  updateMistakeBadge();
}

function getActiveMistakeKeys() {
  return Object.keys(mistakes).filter(k => !mistakes[k].mastered);
}

function updateMistakeBadge() {
  const el = document.getElementById('mistakeCount');
  if (el) el.textContent = toAr(getActiveMistakeKeys().length);
}

function recordMistake(uIdx, qIdx) {
  const key = `${uIdx}_${qIdx}`;
  if (!mistakes[key]) {
    mistakes[key] = { u: uIdx, q: qIdx, fails: 1, streak: 0, mastered: false };
  } else {
    mistakes[key].fails = (mistakes[key].fails || 0) + 1;
    mistakes[key].streak = 0;
    mistakes[key].mastered = false;
  }
  saveMistakes();
}

function recordMasteryProgress(uIdx, qIdx) {
  const key = `${uIdx}_${qIdx}`;
  if (!mistakes[key]) return false;
  mistakes[key].streak = (mistakes[key].streak || 0) + 1;
  mistakes[key].mastered = true;
  saveMistakes();
  return true;
}

$('mistakeBookBtn').onclick = () => { sfx('click'); showMistakeNotebook(); };
$('smartSolverBtn').onclick = () => { sfx('click'); showSmartSolver(); };
updateMistakeBadge();

function getStepsForQuestion(uIdx, qIdx, fallbackW) {
  const key = `${uIdx}_${qIdx}`;
  if (STEP_SOLUTIONS[key]) return STEP_SOLUTIONS[key];
  return [
    "الخطوة ١ (تحديد المعطيات): اقرأ معطيات السؤال وحدد القانون المرتبط به من الوحدة.",
    "الخطوة ٢ (التطبيق الرياضي): " + fallbackW,
    "الخطوة ٣ (النتيجة): تحقّق من مطابقة الإجابة للخطوة السابقة."
  ];
}

/* ===== شاشة التمارين والتحديات (مدعومة بالتلميحات التدريجية ودفتر الأخطاء) ===== */
function quiz(i, k, score, isReviewMode = false, reviewQueue = null) {
  const actualU = isReviewMode ? reviewQueue[k].u : i;
  const actualQ = isReviewMode ? reviewQueue[k].q : k;
  const totalQ = isReviewMode ? reviewQueue.length : L[i].q.length;
  const l = L[actualU], q = l.q[actualQ];
  const steps = getStepsForQuestion(actualU, actualQ, q.w);
  let revealedSteps = 0;

  hud();
  updateMistakeBadge();

  const isFill = q.type === 'fill';
  const answerControlMarkup = isFill
    ? `<div class="fill-wrap">
         <input type="text" class="fill-input" id="fillAns" placeholder="اكتب الإجابة...">
         <button class="btn teal" id="checkFillBtn">تحقق من الإجابة ✔</button>
       </div>`
    : `<div class="opts">
         ${q.o.map((o, j) => `<button class="opt" data-j="${j}">${o}</button>`).join('')}
       </div>`;

    });
  }

    if (revealedSteps < 3) {
      revealedSteps++;
      sfx('click');
      renderSteps(revealedSteps);
      $('hintStatusPill').textContent = `التلميحات المستخدمة: ${toAr(revealedSteps)} / ٣`;

        $('hintStepBtn').textContent = `💡 كشف الخطوة التالية (${toAr(revealedSteps + 1)} / ٣)`;

        recordMistake(actualU, actualQ);
      }
      say(steps[revealedSteps - 1]);
    } else {
      say(steps.join(' ثم '));
    }
  };

  let done = false;
  function finishQuestion(good) {
    renderSteps(3);
    $('hintStepBtn').textContent = '🔊 اسمع خطوات الحل الـ ٣ كاملة';
    $('hintStepBtn').onclick = () => say(steps.join(' . '));

    if (good) {

      score++;

      recordMistake(actualU, actualQ);
      sfx('bad');

    }
    save();
    hud();
    updateMistakeBadge();

    if (isReviewMode) {
      $('ct').innerHTML = `<button class="btn" id="n2">${k < totalQ - 1 ? 'المسألة التالية في المراجعة ◀' : 'إنهاء جلسة العلاج وعرض التقرير 🏆'}</button>`;

      $('ct').innerHTML = `<button class="btn" id="n2">${k < totalQ - 1 ? 'السؤال التالي ◀' : 'عرض النتيجة والوسام 🏆'}</button>`;
      $('n2').onclick = () => k < totalQ - 1 ? quiz(i, k + 1, score) : result(i, score);
    }
  }

  if (isFill) {
    const checkFn = () => {
      if (done) return;
      const val = toEnDigits($('fillAns').value);
      if (!val) return;
      done = true;
      const good = val === String(q.ans);
      $('fillAns').style.borderColor = good ? 'var(--ok)' : 'var(--bad)';
      finishQuestion(good);
    };
    $('checkFillBtn').onclick = checkFn;
    $('fillAns').addEventListener('keydown', e => { if (e.key === 'Enter') checkFn(); });
  } else {
    app.querySelectorAll('.opt').forEach(b => {
      b.onclick = () => {
        if (done) return;
        done = true;
        const j = +b.dataset.j, good = j === q.a;
        app.querySelectorAll('.opt')[q.a].classList.add('ok');
        if (!good) b.classList.add('bad');
        finishQuestion(good);
      };
    });
  }
}

/* ===== المعلم الذكي التفاعلي لحل مسائل الكتاب خطوة بخطوة (AI Step-by-Step Math Solver) ===== */
let solverSeqTimer = null;
function stopSolverSequence() {
  if (solverSeqTimer) {
    clearTimeout(solverSeqTimer);
    solverSeqTimer = null;
  }
}

/* تحويل العلامات الرياضية لنطق عربي واضح خاص بالمعلم الذكي (حلّال المسائل) فقط */
function formatSolverStepForSpeech(stepStr) {
  let t = String(stepStr || '');
  t = t.replace(/<span class="bar-num">([^<]+)<\/span>/g, ' $1 سالب بياني ');
  t = t.replace(/<[^>]+>/g, ' ');
  t = t.replace(/سم²/g, ' سنتيمتر مربع ');
  t = t.replace(/سم/g, ' سنتيمتر ');
  t = t.replace(/م جـ/g, ' ميم جيم ');
  t = t.replace(/أ جـ/g, ' ألف جيم ');
  t = t.replace(/أ ب/g, ' ألف باء ');
  t = t.replace(/جـ/g, ' جيم ');
  t = t.replace(/نق/g, ' نصف القطر ');
  t = t.replace(/(?<![أ-ي])ص\s*([٠-٩0-9]+)/g, ' صفحة $1 ');
  t = t.replace(/س²/g, ' سين تربيع ');
  t = t.replace(/ص²/g, ' صاد تربيع ');
  t = t.replace(/ب²/g, ' باء تربيع ');
  t = t.replace(/²/g, ' تربيع ');
  t = t.replace(/₁/g, ' الأول ');
  t = t.replace(/₂/g, ' الثاني ');
  t = t.replace(/([٠-٩0-9]+)\s*س(?![أ-ي])/g, '$1 سين ');
  t = t.replace(/([٠-٩0-9]+)\s*ص(?![أ-ي])/g, '$1 صاد ');
  t = t.replace(/([٠-٩0-9]+)\s*جـ/g, '$1 جيم ');
  t = t.replace(/([٠-٩0-9]+)[,٫.]([٠-٩0-9]+)/g, '$1 فاصلة $2');
  // إشارة السالب بعد = أو ( أو { أو ،
  t = t.replace(/(^|[=({،:؛])\s*[−-]\s*([٠-٩0-9]+|سين|صاد|س|ص|ب)/g, '$1 سالب $2');
  // علامة الطرح بين الحدود
  t = t.replace(/\s*[−-]\s*/g, ' ناقص ');
  // العلامات الرياضية
  t = t.replace(/=/g, ' يساوي ');
  t = t.replace(/\+/g, ' زائد ');
  t = t.replace(/×/g, ' ضرب ');
  t = t.replace(/÷/g, ' تقسيم ');
  t = t.replace(/√/g, ' الجذر التربيعي لـ ');
  t = t.replace(/ϕ/g, ' فاي أي المجموعة الخالية ');
  t = t.replace(/</g, ' أصغر من ');
  t = t.replace(/>/g, ' أكبر من ');
  // المتغيرات المفردة
  t = t.replace(/في الأعداد الحقيقية ح/g, 'في الأعداد الحقيقية حاء');
  t = t.replace(/(?<![أ-ي])س(?![أ-ي])/g, ' سين ');
  t = t.replace(/(?<![أ-ي])ص(?![أ-ي])/g, ' صاد ');
  t = t.replace(/(?<![أ-ي])ب(?![أ-ي])/g, ' باء ');
  t = t.replace(/(?<![٠-٩0-9])[٠0](?![٠-٩0-9])/g, ' صفر ');
  // وقفات مريحة بدلاً من الأقواس لتبطيء القراءة وتوضيحها
  t = t.replace(/[(){}:]/g, ' ، ');
  t = t.replace(/(\s*،\s*)+/g, ' ، ');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}

/* قراءة خطوات المعلم الذكي خطوة تلو الأخرى بفاصل هادئ حتى لا يقرأ بسرعة */
async function speakSolverStepsSequentially(stepsArray) {
  stopSolverSequence();
  if (!voice || !stepsArray || !stepsArray.length) return;

  let idx = 0;
  async function playNext() {
    if (idx >= stepsArray.length || !voice) return;
    const spoken = formatSolverStepForSpeech(stepsArray[idx]);
    idx++;
    await say(spoken);
    if ( currentElAudio ) {
      currentElAudio.onended = () => {
        const spBtn = document.getElementById('sp');
        if (spBtn) spBtn.innerHTML = '🔊 إعادة سماع الشرح';
        solverSeqTimer = setTimeout(playNext, 650);
      };
    }
  }
  playNext();
}

        let steps = [];

            `الخطوة ١ (فحص المعادلة ${eq}): نبحث عن عددين حاصل ضربهما (${toAr(c)}) ومجموعهما (${toAr(b)}).`,

      const runStat = (speakNow = false) => {

        const sorted = [...nums].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        const median = sorted.length % 2 === 1 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        const freq = {};
        let maxF = 0, modeVal = sorted[0];
        sorted.forEach(n => { freq[n] = (freq[n] || 0) + 1; if (freq[n] > maxF) { maxF = freq[n]; modeVal = n; } });
        const fMean = toAr(Number.isInteger(mean) ? mean : mean.toFixed(2));
        const fMed = toAr(Number.isInteger(median) ? median : median.toFixed(2));
        const modeText = maxF > 1 ? `القيمة (${toAr(modeVal)}) لتكرارها (${toAr(maxF)}) مرات` : 'لا يوجد منوال وحيد (جميع القيم بتكرار واحد)';
        const steps = [
          `الخطوة ١ (الوسط الحسابي - ص ٢٥٥): مجموع القيم ÷ عددها = ${toAr(sum)} ÷ ${toAr(nums.length)} = ${fMean}.`,
          `الخطوة ٢ (الوسيط بعد الترتيب التصاعدي - ص ٢٦١): القيم مرتبة هي [${sorted.map(toAr).join(' ، ')}] ، والقيمة التي تتوسطها هي الوسيط = ${fMed}.`,
          `الخطوة ٣ (المنوال - ص ٢٦٣): القيمة الأكثر شيوعاً وتكراراً بين المفردات هي: ${modeText}.`
        ];
        renderSolverStepCards('statStepsOut', steps);
        if (speakNow) speakSolverStepsSequentially(steps);
      };
      $('solveStatBtn').onclick = () => { sfx('ok'); runStat(true); };
      runStat(false);
    } else if (solverTab === 7) {
      // الحجوم: الأسطوانة، المخروط، الكرة (الوحدة ٨ - ص ٢٨٣-٢٩٧)
      ws.innerHTML = `
        <div style="font-weight:900;color:var(--pink);text-align:center;margin-bottom:8px">
          حساب حجوم المجسمات الهندسية: الأسطوانة، المخروط، والكرة (ص ٢٨٧–٢٩٧)
        </div>
        <div class="tutor-grid">
          <label>نصف القطر نق (سم): <input type="number" id="volR" class="tutor-input" value="7" min="1"></label>
          <label>الارتفاع ع (سم): <input type="number" id="volH" class="tutor-input" value="15" min="1"></label>
        </div>
        <div class="row">
          <button class="btn teal" id="solveVolBtn">📐 احسب حجوم الأسطوانة والمخروط والكرة في ٣ خطوات</button>
        </div>
        <div id="volStepsOut" style="margin-top:12px"></div>
      `;
      const runVol = (speakNow = false) => {
        const r = parseFloat($('volR').value) || 7;
        const h = parseFloat($('volH').value) || 15;
        const cyl = (22 / 7) * r * r * h;
        const cone = cyl / 3;
        const sph = (4 / 3) * (22 / 7) * r * r * r;
        const fmt = v => toAr(Number.isInteger(v) ? v : v.toFixed(2));
        const steps = [
          `الخطوة ١ (حجم الأسطوانة القائمة - ص ٢٨٧): ح = π نق² ع = (٢٢ ÷ ٧) × ${toAr(r)}² × ${toAr(h)} = ${fmt(cyl)} سم³.`,
          `الخطوة ٢ (حجم المخروط القائم المشترك معها في القاعدة والارتفاع - ص ٢٩١): ح = ⅓ حجم الأسطوانة = ${fmt(cyl)} ÷ ٣ = ${fmt(cone)} سم³.`,
          `الخطوة ٣ (حجم الكرة التي نصف قطرها نق = ${toAr(r)} سم - ص ٢٩٥): ح = (٤ ÷ ٣) π نق³ = ${fmt(sph)} سم³.`
        ];
        renderSolverStepCards('volStepsOut', steps);
        if (speakNow) speakSolverStepsSequentially(steps);
      };
      $('solveVolBtn').onclick = () => { sfx('ok'); runVol(true); };
      runVol(false);
    }
  }

  renderSolver();
}

/* ===== شاشة النتيجة والأوسمة ===== */
function result(i, score) {
  const l = L[i], n = l.q.length;
  const stars = score === n ? 3 : score >= n - 1 ? 2 : score > 0 ? 1 : 0;
  prog[i] = Math.max(prog[i] || 0, stars);
  if (stars) xp += stars * 20;
  save();
  hud();
  updateMistakeBadge();
  sfx(stars ? 'win' : 'bad');
  const msg = [
    'لا تيأس! راجع دفتر أخطائك الذكي والمختبر التفاعلي وحاول مرة أخرى 💪',
    'جيد، يمكنك تحقيق نتيجة أعلى بمراجعة خطوات الحل! 👍',
    'ممتاز! لقد استحققت وسام الوحدة 👏',
    'عبقري رياضيات! إجابات كاملة ومطابقة للكتاب 🏅'
  ][stars];

  const activeMistakes = getActiveMistakeKeys().length;

  app.innerHTML = `
    <div class="book-sheet pop" style="text-align:center">
      <h2 style="margin:.2em 0;color:var(--acc2)">${l.e} ${l.n}</h2>
      <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <p style="font-size:1.2rem;font-weight:800">أجبت على ${toAr(score)} من ${toAr(n)} بشكل صحيح<br>${msg}</p>
      ${stars >= 2 ? `<div class="pill" style="font-size:1.05rem;border-color:var(--acc);padding:8px 18px;margin-top:6px">🏅 حصلت على وسام: ${l.badge}</div>` : ''}
      <div class="book-footer">
        <div class="book-footer-ribbon"></div>
        <div class="book-footer-line"></div>
        <div class="book-page-diamond"><span>${toAr(l.pEnd)}</span></div>
        <div class="book-footer-title">الرياضيات - الثالث متوسط</div>
      </div>
    </div>
    <div class="row">
      <button class="btn alt" id="rp">🔁 أعد الدرس</button>
      <button class="btn alt" id="rq">🎯 أعد التحدي</button>
      ${activeMistakes > 0 ? `<button class="btn pink" id="rmb">📓 راجع أخطاءك (${toAr(activeMistakes)})</button>` : ''}
      <button class="btn" id="hm">🏠 الدروس</button>
    </div>
  `;
  say(msg);
  $('rp').onclick = () => learn(i, 0);
  $('rq').onclick = () => quiz(i, 0, 0);
  if ($('rmb')) $('rmb').onclick = () => showMistakeNotebook();
  $('hm').onclick = home;
}

const GH_STORAGE_KEY = 'math_grade3_gh_config_v1';
const GH_LEGACY_CRM_KEY = 'sudanese_schools_gh_config_v1';

function getAllBookSayTexts() {
  const list = [];
  if (typeof L !== 'undefined' && Array.isArray(L)) {
    L.forEach((unit, uIdx) => {
      if (Array.isArray(unit.steps)) {
        unit.steps.forEach((st, sIdx) => {
          const txt = (st.say || st.h || '').trim();
          if (txt) list.push({ unitTitle: unit.t, stepTitle: st.h, text: txt, uIdx, sIdx });
        });
      }
    });
  }
  return list;
}

function loadOwnerGhConfig() {
  try {
    const raw = localStorage.getItem(GH_STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.token) return p;
    }
    const leg = localStorage.getItem(GH_LEGACY_CRM_KEY);
    if (leg) {
      const p = JSON.parse(leg);
      if (p && p.token) return { token: p.token, owner: p.owner || 'aljompolaty', repo: 'math-grade3-game' };
    }
  } catch (e) {}
  return { token: '', owner: 'aljompolaty', repo: 'math-grade3-game' };
}

function saveOwnerGhConfig(cfg) {
  try {
    localStorage.setItem(GH_STORAGE_KEY, JSON.stringify(cfg));
  } catch (e) {}
}

function updateEmbeddedCounterUI() {
  const allClips = getAllBookSayTexts();
  const total = allClips.length || 32;
  const doneCount = allClips.filter(item => !!B64_YOUSEF[item.text]).length;
  const pct = Math.min(100, Math.round((doneCount / total) * 100));

  const badge = $('ownerEmbedBadge');
  if (badge) {
    badge.innerHTML = `🎙️ الصوتيات المدمجة: ${toAr(doneCount)} / ${toAr(total)} (${toAr(pct)}٪)`;
    badge.style.borderColor = doneCount === total ? 'var(--ok)' : 'var(--pink)';
    badge.style.color = doneCount === total ? 'var(--ok)' : 'var(--pink)';
  }
  const bar = $('ownerSyncBarFill');
  if (bar) bar.style.width = pct + '%';
}

function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

  syncEmbeddedDataScriptTag();
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll('head script').forEach(s => s.remove());
  // إزالة لوحة المالك المؤقتة بالكامل من النسخة المرفوعة على GitHub أو المنزّلة للطلاب

  if (ownerFoot) ownerFoot.remove();
  let rawHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
  rawHtml = rawHtml.replace(/AIza[0-9A-Za-z\-_]{30,}/g, '');
  rawHtml = rawHtml.replace(/ghp_[0-9A-Za-z]{30,}/g, '');
  rawHtml = rawHtml.replace(/sk_[0-9a-fA-F]{30,}/g, '');
  return rawHtml;
}
