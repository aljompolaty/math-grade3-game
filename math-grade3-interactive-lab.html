async function putFileToGithub(owner, repo, path, contentB64, message, headers) {
  let sha = undefined;
  const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, { headers });
  if (getRes.ok) {
    const getData = await getRes.json();
    sha = getData.sha;
  }
  const bodyObj = { message, content: contentB64 };
  if (sha) bodyObj.sha = sha;
  const putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
    method: 'PUT',
    headers,
    body: JSON.stringify(bodyObj)
  });
  if (!putRes.ok) {
    const errData = await putRes.json().catch(() => ({}));
    throw new Error((errData && errData.message) || ('فشل رفع الملف ' + path));
  }
  return await putRes.json();
}

async function pushAllFilesSingleCommit(owner, repo, branch, filesList, commitMessage, headers, resBox) {
  // جلب آخر commit و tree على الفرع الرئيسي
  const refRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${branch}`, { headers });
  if (!refRes.ok) throw new Error('تعذر قراءة الفرع الرئيسي ' + branch);
  const refData = await refRes.json();
  const latestCommitSha = refData.object.sha;

  const commitRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits/${latestCommitSha}`, { headers });
  const commitData = await commitRes.json();
  const baseTreeSha = commitData.tree.sha;

  // إنشاء Blobs لجميع الملفات بالتوازي
  const treeItems = [];
  for (let i = 0; i < filesList.length; i++) {
    const f = filesList[i];
    if (resBox) {
      resBox.innerHTML = `⏳ جاري تجهيز حزمة الرفع الموحدة (${toAr(i + 1)} / ${toAr(filesList.length)}): <code>${f.path}</code>...`;
    }
    const blobRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/blobs`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ content: f.b64, encoding: 'base64' })
    });
    if (!blobRes.ok) throw new Error('فشل تجهيز الملف ' + f.path);
    const blobData = await blobRes.json();
    treeItems.push({
      path: f.path,
      mode: '100644',
      type: 'blob',
      sha: blobData.sha
    });
  }

  // محاولة تضمين إصلاح ملف workflow إذا كان الرمز يمتلك صلاحية workflow
  let newTreeSha = null;
  try {
    const wfBlobRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/blobs`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ content: GH_COMPANION_FILES_B64['.github/workflows/deploy-pages.yml'], encoding: 'base64' })
    });
    if (wfBlobRes.ok) {
      const wfBlob = await wfBlobRes.json();
      const treeWithWfRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          base_tree: baseTreeSha,
          tree: [...treeItems, { path: '.github/workflows/deploy-pages.yml', mode: '100644', type: 'blob', sha: wfBlob.sha }]
        })
      });
      if (treeWithWfRes.ok) {
        const treeWithWf = await treeWithWfRes.json();
        const commitWithWfRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ message: commitMessage, tree: treeWithWf.sha, parents: [latestCommitSha] })
        });
        if (commitWithWfRes.ok) {
          const newCommit = await commitWithWfRes.json();
          const updateRefRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({ sha: newCommit.sha, force: true })
          });
          if (updateRefRes.ok) return true;
        }
      }
    }
  } catch (e) {}

  // إذا لم تكن صلاحية workflow مفعلة في الرمز، نرفع جميع ملفات التطبيق في Commit واحد نظيف
  const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees`, {
    method: 'POST',
    headers,
    body: JSON.stringify({ base_tree: baseTreeSha, tree: treeItems })
  });
  if (!treeRes.ok) throw new Error('تعذر إنشاء شجرة الملفات على GitHub');
  const treeData = await treeRes.json();

  const newCommitRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits`, {
    method: 'POST',
    headers,
    body: JSON.stringify({ message: commitMessage, tree: treeData.sha, parents: [latestCommitSha] })
  });
  if (!newCommitRes.ok) throw new Error('تعذر إنشاء الـ Commit الموحد');
  const newCommitData = await newCommitRes.json();

  const patchRefRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`, {
    method: 'PATCH',
    headers,
    body: JSON.stringify({ sha: newCommitData.sha, force: true })
  });
  if (!patchRefRes.ok) throw new Error('تعذر تحديث الفرع الرئيسي');
  return true;
}

async function pushCleanAppWithVoicesToGithub(isAuto = false) {
  const tokenInput = $('ownerGhToken');
  const repoInput = $('ownerGhRepo');
  const resBox = $('ownerGhResultBox');
  const pushBtn = $('ownerPushGhBtn');

  const saved = loadOwnerGhConfig();
  const token = ((tokenInput && tokenInput.value) || saved.token || '').trim();
  const repoName = ((repoInput && repoInput.value) || saved.repo || 'math-grade3-game').trim().replace(/\s+/g, '-');

  if (!token) {
    if (!isAuto && resBox) {
      resBox.style.display = 'block';
      resBox.style.borderColor = 'var(--bad)';
      resBox.innerHTML = '⚠️ للرفع المباشر إلى حسابك على GitHub، الصق رمز الوصول (<code>ghp_...</code>) في الحقل أعلاه ثم اضغط زر الرفع (أو اضغط «🔑 استخراج رمز Token» لاستخراجه في ثوانٍ).';
    }
    return;
  }

  if (pushBtn) pushBtn.disabled = true;
  if (resBox) {
    resBox.style.display = 'block';
    resBox.style.borderColor = 'var(--acc2)';
    resBox.innerHTML = '⏳ خطوة ١/٢: جاري التأكد من اكتمال دمج جميع المقاطع الصوتية الـ ٣٢ داخل الكود قبل الرفع...';
  }

  try {
    await ensureAll32VoicesEmbedded();

    if (resBox) {
      resBox.innerHTML = '⏳ خطوة ٢/٢: جاري الاتصال بحساب GitHub ورفع النسخة النظيفة المدمجة بالصوتيات في دفعة واحدة (Single Commit)...';
    }

    const headers = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };

    const userRes = await fetch('https://api.github.com/user', { headers });
    if (!userRes.ok) {
      throw new Error('رمز الوصول (Token) غير صالح أو منتهي الصلاحية. يرجى توليد رمز جديد بصلاحية repo.');
    }
    const userData = await userRes.json();
    const owner = userData.login || 'aljompolaty';
    saveOwnerGhConfig({ token, owner, repo: repoName });

    const repoCheck = await fetch('https://api.github.com/repos/' + owner + '/' + repoName, { headers });
    if (repoCheck.status === 404) {
      const createRes = await fetch('https://api.github.com/user/repos', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          name: repoName,
          description: 'مختبر الرياضيات التفاعلي – الصف الثالث المتوسط (منهج بخت الرضا ٢٠٢٤م) — Android PWA',
          public: true,
          auto_init: true
        })
      });
      if (!createRes.ok && createRes.status !== 422) {
        const errCreate = await createRes.json().catch(() => ({}));
        throw new Error(errCreate.message || 'تعذر إنشاء المستودع على GitHub');
      }
      await new Promise(r => setTimeout(r, 1500));
    }

    const repoMetaRes = await fetch('https://api.github.com/repos/' + owner + '/' + repoName, { headers });
    const repoMeta = repoMetaRes.ok ? await repoMetaRes.json() : { default_branch: 'main' };
    const defaultBranch = repoMeta.default_branch || 'main';

    const cleanHtmlStr = buildCleanStudentHtmlString();
    const cleanHtmlB64 = utf8ToB64(cleanHtmlStr);

    const filesQueue = [
      { path: 'index.html', b64: cleanHtmlB64 },
      { path: 'math-grade3-interactive-lab.html', b64: cleanHtmlB64 },
      { path: 'manifest.json', b64: GH_COMPANION_FILES_B64['manifest.json'] },
      { path: 'sw.js', b64: GH_COMPANION_FILES_B64['sw.js'] },
      { path: '.nojekyll', b64: GH_COMPANION_FILES_B64['.nojekyll'] },
      { path: 'README.md', b64: GH_COMPANION_FILES_B64['README.md'] },
      { path: 'icons/icon-192.png', b64: GH_COMPANION_FILES_B64['icons/icon-192.png'] },
      { path: 'icons/icon-512.png', b64: GH_COMPANION_FILES_B64['icons/icon-512.png'] },
      { path: 'icons/maskable-512.png', b64: GH_COMPANION_FILES_B64['icons/maskable-512.png'] }
    ];

    await pushAllFilesSingleCommit(
      owner,
      repoName,
      defaultBranch,
      filesQueue,
      'Deploy clean Math Grade 3 Interactive Lab with 32 embedded ElevenLabs voices',
      headers,
      resBox
    );

    if (resBox) {
      resBox.innerHTML = '⏳ جاري ضبط GitHub Pages على النشر المباشر من الفرع الرئيسي (بدون تعليق Actions)...';
    }

    // ضبط GitHub Pages على النشر المباشر من الفرع (build_type: legacy) لتفادي خطأ No artifacts named github-pages
    const pagesCreateRes = await fetch('https://api.github.com/repos/' + owner + '/' + repoName + '/pages', {
      method: 'POST',
      headers,
      body: JSON.stringify({ build_type: 'legacy', source: { branch: defaultBranch, path: '/' } })
    });
    if (!pagesCreateRes.ok) {
      await fetch('https://api.github.com/repos/' + owner + '/' + repoName + '/pages', {
        method: 'PUT',
        headers,
        body: JSON.stringify({ build_type: 'legacy', source: { branch: defaultBranch, path: '/' } })
      }).catch(() => {});
    }
    // طلب بناء فوري لصفحة GitHub Pages
    await fetch('https://api.github.com/repos/' + owner + '/' + repoName + '/pages/builds', {
      method: 'POST',
      headers
    }).catch(() => {});

    const repoUrl = 'https://github.com/' + owner + '/' + repoName;
    const pagesUrl = 'https://' + owner + '.github.io/' + repoName + '/';

    sfx('win');
    if (resBox) {
      resBox.style.borderColor = 'var(--ok)';
      resBox.innerHTML = `
        <div style="color:var(--ok);font-size:.98rem;margin-bottom:4px">🎉 تم رفع النسخة النظيفة وجميع المقاطع الصوتية الـ ٣٢ في دفعة واحدة وإصلاح نشر GitHub Pages بنجاح!</div>
        <div>🔗 <b>رابط المستودع المحدّث:</b> <a href="${repoUrl}" target="_blank" rel="noopener noreferrer" dir="ltr" style="color:var(--acc2);font-family:monospace">${repoUrl}</a></div>
        <div>🌐 <b>رابط الموقع المباشر للطلاب (GitHub Pages):</b> <a href="${pagesUrl}" target="_blank" rel="noopener noreferrer" dir="ltr" style="color:var(--ok);font-family:monospace;font-weight:900">${pagesUrl}</a></div>
      `;
    }
  } catch (err) {
    sfx('bad');
    if (resBox) {
      resBox.style.borderColor = 'var(--bad)';
      resBox.innerHTML = '❌ <b>تعذر إتمام الرفع:</b> ' + (err.message || err);
    }
  } finally {
    if (pushBtn) pushBtn.disabled = false;
  }
}

    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';

    setTimeout(() => {

      URL.revokeObjectURL(url);
    }, 400);
